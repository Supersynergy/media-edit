[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "media-edit-index"
version = "0.1.0"
description = "Local video search and explainable multimodal highlights for media-edit"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
media-index = "media_index.cli:main"

[project.optional-dependencies]
# Opt in per backend. Model weights must be provisioned separately, then passed by local path.
parakeet = ["parakeet-mlx==0.5.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]
mlx = ["mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]
whisper = ["faster-whisper==1.2.1"]
semantic = ["sentence-transformers==6.1.0"]
multimodal = ["transformers==5.20.1", "torch==2.14.1", "Pillow==13.0.0", "numpy==2.5.4"]
scenes = ["scenedetect==0.7.2"]

[tool.setuptools.packages.find]
include = ["media_index*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
